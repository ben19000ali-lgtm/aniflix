<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniFlix - Streaming Animés VOSTFR & VF</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0f12; color: #e1e6ed; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        header { background-color: #15181e; display: flex; align-items: center; justify-content: space-between; padding: 15px 5%; border-bottom: 2px solid #e50914; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #ffffff; text-decoration: none; }
        .logo span { color: #e50914; }
        .search-box { display: flex; background: #1f232d; border-radius: 20px; padding: 5px 15px; width: 100%; max-width: 300px; }
        .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; padding: 5px; font-size: 0.9rem; }
        nav { display: flex; gap: 20px; }
        nav a { color: #a0a7b5; text-decoration: none; font-weight: 500; }
        nav a.active { color: #ffffff; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 1.4rem; margin-bottom: 20px; border-left: 4px solid #e50914; padding-left: 10px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background-color: #15181e; border-radius: 8px; overflow: hidden; text-decoration: none; color: white; border: 1px solid #1f232d; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .poster-container { position: relative; width: 100%; height: 260px; background-color: #1a1d24; }
        .poster-container img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 10px; left: 10px; background-color: #e50914; color: white; font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .badge.vf { background-color: #007bc7; }
        .card-info { padding: 12px; }
        .card-info h3 { font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info p { font-size: 0.8rem; color: #828a99; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Ani<span>Flix</span></a>
        <nav>
            <a href="#" class="active">Accueil</a>
            <a href="#">Catalogue</a>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Rechercher un animé...">
        </div>
    </header>
    <div class="container">
        <h2 class="section-title">Dernières Sorties</h2>
        <div class="grid">
            <a href="demon-slayer.html" class="card">
                <div class="poster-container">
                    <span class="badge">VOSTFR</span>
                    <img src="https://i.imgur.com/8N4Z4M8.jpg" alt="Demon Slayer">
                </div>
                <div class="card-info">
                    <h3>Demon Slayer</h3>
                    <p>Saison 4 • Épisode 12</p>
                </div>
            </a>
            <a href="jujutsu-kaisen.html" class="card">
                <div class="poster-container">
                    <span class="badge vf">VF</span>
                    <img src="https://i.imgur.com/3Z5V8QG.jpg" alt="Jujutsu Kaisen">
                </div>
                <div class="card-info">
                    <h3>Jujutsu Kaisen</h3>
                    <p>Saison 2 • Épisode 23</p>
                </div>
            </a>
            <a href="one-piece.html" class="card">
                <div class="poster-container">
                    <span class="badge">VOSTFR</span>
                    <img src="https://i.imgur.com/K1L8RzX.jpg" alt="One Piece">
                </div>
                <div class="card-info">
                    <h3>One Piece</h3>
                    <p>Épisode 1090</p>
                </div>
            </a>
            <a href="snk.html" class="card">
                <div class="poster-container">
                    <span class="badge vf">VF</span>
                    <img src="https://i.imgur.com/Y4S6F6L.jpg" alt="L'Attaque des Titans">
                </div>
                <div class="card-info">
                    <h3>Attack on Titan</h3>
                    <p>Saison 4 • Final</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
